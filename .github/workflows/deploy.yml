name: Deploy notes to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: jackyzha0/quartz
          # Pinned so Quartz updates can't break the site unannounced
          ref: 97a2d05f80c4c50534959b1d0d41cc4b3895625e
          path: .quartz-src
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build site
        run: bash .site/build.sh .quartz-src
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .quartz-src/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
